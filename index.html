    <meta name="theme-color" content="#ffffff" />
    <script>
      // Tema claro u oscuro antes del primer pintado, para que no parpadee:
      // preferencia guardada (src/hooks/useTheme.js) o, si no hay, la del sistema.
      try {
        var theme = localStorage.getItem('wf-theme')
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#111111')
      } catch (e) {}
    </script>
